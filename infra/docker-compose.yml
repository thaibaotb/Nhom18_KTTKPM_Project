services:
  api-gateway:
    build:
      context: ../services/api-gateway
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      AUTH_SERVICE_URL: http://auth-service:3001
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL:-http://product-service:3002}
      AI_AGENT_SERVICE_URL: ${AI_AGENT_SERVICE_URL:-http://ai-agent-service:3010}
      CART_SERVICE_URL: http://cart-service:3003
      ORDER_SERVICE_URL: http://order-service:3004
      CHAT_SERVICE_URL: http://chat-service:3005
      JWT_SECRET: change_me_in_dev
    depends_on:
      - auth-service
      - product-service
      - cart-service
      - order-service
      - chat-service

  auth-service:
    build:
      context: ../services/auth-service
    container_name: auth-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: development
      POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/auth_service
      JWT_SECRET: change_me_in_dev
      JWT_EXPIRES_IN: 24h
      REFRESH_TOKEN_EXPIRES_IN: 7d
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
    depends_on:
      - postgres

  product-service:
    build:
      context: ../services/product-service
    container_name: product-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/product_service
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
    depends_on:
      - mongodb

  chat-service:
    build:
      context: ../services/chat-service
    container_name: chat-service
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/chat_service
      JWT_SECRET: change_me_in_dev
    depends_on:
      - mongodb

  ai-agent-service:
    build:
      context: ../services/ai-agent-service
    container_name: ai-agent-service
    ports:
      - "3010:3010"
    environment:
      PORT: 3010
      NODE_ENV: development
      API_GATEWAY_URL: http://api-gateway:3000
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:latest}
      FAQ_PATH: /app/data/faq.json
      AI_ASSISTANT_NAME: ELPPA Assistant
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cart-service:
    build:
      context: ../services/cart-service
    container_name: cart-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/cart_service
      JWT_SECRET: change_me_in_dev
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL:-http://product-service:3002}
    depends_on:
      - mongodb

  order-service:
    build:
      context: ../services/order-service
    container_name: order-service
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/order_service
      JWT_SECRET: change_me_in_dev
      CART_SERVICE_URL: http://cart-service:3003
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL:-http://product-service:3002}
      PAYMENT_SERVICE_URL: http://payment-service:5003
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID}
      PAYOS_API_KEY: ${PAYOS_API_KEY}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY}
      PAYOS_API_URL: ${PAYOS_API_URL}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL}
    depends_on:
      - mongodb

  payment-service:
    build:
      context: ../services/payment-service
    container_name: payment-service
    ports:
      - "5003:5003"
    environment:
      PORT: 5003
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/payment_service
      ORDER_SERVICE_URL: http://order-service:3004
      INTERNAL_SERVICE_SECRET: change-me
      ADMIN_SECRET: change-me-admin
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID}
      PAYOS_API_KEY: ${PAYOS_API_KEY}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY}
      PAYOS_API_URL: ${PAYOS_API_URL}
    depends_on:
      - mongodb
      - order-service

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_service
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  mongo_data:
  redis_data:
